name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate annotator before publishing
        run: |
          for source in annotator/*.js; do node --check "$source"; done
          node --test tests/annotator-scope.test.cjs tests/annotator-sync.test.cjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Supabase config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ALLOW_SIGNUP: ${{ secrets.SUPABASE_ALLOW_SIGNUP }}
        run: python3 gen_config.py

      - name: Prepare the site folder
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re
          def version(match):
              asset = pathlib.Path(match[2])
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()[:12]
              return match[1] + match[2] + '?v=' + digest + match[3]
          html = pathlib.Path('annotator.html').read_text()
          html = re.sub(r'((?:src|href)=")(annotator/[^"?]+\.(?:js|css))(")', version, html)
          pathlib.Path('index.html').write_text(html)
          PY
          ls -A | grep -vE '^(index\.html|annotator|data_annotated)$' | xargs -r rm -rf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
